name: Release Linux

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v1.0.0)'
        required: true

jobs:
  build-linux:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build and package for Linux
        run: npm run make
        env:
          NODE_ENV: production
          
      - name: List build artifacts
        run: |
          echo "=== Contents of out/make ==="
          find out/make -type f -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" | head -20
          
      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: black-citadel-deb
          path: out/make/deb/x64/*.deb
          if-no-files-found: error
          
      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: black-citadel-rpm
          path: out/make/rpm/x64/*.rpm
          if-no-files-found: error
          
      - name: Upload AppImage artifact (if exists)
        uses: actions/upload-artifact@v4
        with:
          name: black-citadel-appimage
          path: out/make/*.AppImage
          if-no-files-found: ignore

  create-release:
    needs: build-linux
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          
      - name: List downloaded artifacts
        run: |
          echo "=== Downloaded artifacts ==="
          find artifacts -type f | head -20
          
      - name: Get version from tag
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION=${{ github.event.inputs.tag }}
          else
            VERSION=${GITHUB_REF#refs/tags/}
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION"
          
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: Black Citadel ${{ steps.get_version.outputs.VERSION }}
          body: |
            ## Black Citadel ${{ steps.get_version.outputs.VERSION }}
            
            ### Linux Releases
            
            This release includes the following Linux packages:
            - **DEB Package** - For Debian/Ubuntu based distributions
            - **RPM Package** - For Red Hat/Fedora based distributions
            - **AppImage** - Universal Linux package (if available)
            
            ### Installation
            
            #### Debian/Ubuntu
            ```bash
            sudo dpkg -i black-citadel_*.deb
            # Fix any dependency issues
            sudo apt-get install -f
            ```
            
            #### Red Hat/Fedora
            ```bash
            sudo rpm -i black-citadel-*.rpm
            # Or with yum/dnf
            sudo dnf install black-citadel-*.rpm
            ```
            
            #### AppImage
            ```bash
            chmod +x Black-Citadel-*.AppImage
            ./Black-Citadel-*.AppImage
            ```
            
            ### Requirements
            - Linux x64 system
            - kubectl configured with cluster access
            
            ### What's Changed
            See [commit history](https://github.com/${{ github.repository }}/commits/${{ steps.get_version.outputs.VERSION }}) for details.
            
          draft: true
          prerelease: false
          files: |
            artifacts/black-citadel-deb/*.deb
            artifacts/black-citadel-rpm/*.rpm
            artifacts/black-citadel-appimage/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}